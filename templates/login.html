<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Associação Criança Feliz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            color: #1677c8;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #1677c8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1677c8;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d5fa8;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1677c8;
        }

        .mensagem {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffe0e0;
            color: #b00000;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            class="logo"
            alt="Associação Criança Feliz"
        >

        <h1>Área Administrativa</h1>

        <p class="subtitulo">
            Associação Criança Feliz
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="usuario">Usuário</label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Digite o usuário"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite a senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <a href="{{ url_for('inicio') }}" class="voltar">
            ← Voltar para o início
        </a>

    </div>

</body>
</html>
