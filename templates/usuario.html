<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha conta - Atletismo Sorocaba</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            color: #ffcc00;
            margin-top: 5px;
        }

        .sair {
            background: #ffcc00;
            color: #111;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .boas-vindas {
            background: #ffcc00;
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .boas-vindas h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .boas-vindas p {
            font-size: 18px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 7px 20px rgba(0,0,0,.08);
        }

        .card h3 {
            font-size: 23px;
            margin-bottom: 15px;
        }

        .card p {
            color: #666;
            line-height: 1.7;
        }

        .horario {
            border-left: 6px solid #ffcc00;
        }

        .perfil {
            border-left: 6px solid #222;
        }

        footer {
            margin-top: 60px;
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer p {
            margin: 6px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .boas-vindas h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>

    <div>
        <h1>
            🏃 Atletismo Sorocaba
        </h1>

        <p>
            Vila Gabriel
        </p>
    </div>

    <a
        href="{{ url_for('logout') }}"
        class="sair"
    >
        Sair
    </a>

</header>


<main class="container">

    <section class="boas-vindas">

        <h2>
            Olá, {{ nome }}! 👋
        </h2>

        <p>
            Bem-vindo à área do atleta.
        </p>

    </section>


    <section class="cards">

        <div class="card perfil">

            <h3>
                👤 Minha conta
            </h3>

            <p>
                <strong>Nome:</strong>
                {{ nome }}
            </p>

            <p>
                <strong>E-mail:</strong>
                {{ email }}
            </p>

        </div>


        <div class="card horario">

            <h3>
                📅 Horários
            </h3>

            <p>
                🧒 <strong>Infantil:</strong>
                09:00 às 17:00
            </p>

            <p>
                🏃 <strong>Adulto:</strong>
                16:00 às 18:00
            </p>

            <p>
                📍 Vila Gabriel - Sorocaba
            </p>

        </div>

    </section>

</main>


<footer>

    <p>
        🏃 Atletismo Sorocaba - Vila Gabriel
    </p>

    <p>
        © 2026
    </p>

</footer>

</body>
</html>
