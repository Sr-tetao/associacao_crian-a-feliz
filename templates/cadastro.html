<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Atletismo Sorocaba</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #111, #292929);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .logo .icone {
            font-size: 60px;
        }

        .logo h1 {
            font-size: 28px;
            margin-top: 8px;
        }

        .logo p {
            color: #ffcc00;
            margin-top: 5px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .card h2 {
            text-align: center;
            color: #111;
            margin-bottom: 25px;
            font-size: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ffcc00;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ffcc00;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e6b800;
        }

        .mensagens {
            margin-bottom: 18px;
        }

        .mensagem {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #ffe6e6;
            color: #a00000;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login a {
            color: #111;
            font-weight: bold;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">

        <div class="icone">
            🏃
        </div>

        <h1>
            Atletismo Sorocaba
        </h1>

        <p>
            Vila Gabriel
        </p>

    </div>

    <div class="card">

        <h2>
            📝 Criar conta
        </h2>

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% if mensagens %}

                <div class="mensagens">

                    {% for categoria, mensagem in mensagens %}

                        <div class="mensagem">
                            {{ mensagem }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}

        <form
            method="POST"
            action="{{ url_for('cadastrar') }}"
        >

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Mínimo de 6 caracteres"
                minlength="6"
                required
            >

            <label for="confirmar_senha">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                placeholder="Digite a senha novamente"
                minlength="6"
                required
            >

            <button type="submit">
                Criar minha conta
            </button>

        </form>

        <div class="login">

            Já possui uma conta?

            <a href="{{ url_for('login') }}">
                Entrar
            </a>

        </div>

        <a
            href="{{ url_for('inicio') }}"
            class="voltar"
        >
            ← Voltar para o início
        </a>

    </div>

</div>

</body>
</html>
